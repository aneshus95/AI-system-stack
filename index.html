<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learning materials</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--mute:#656d76;--line:#d0d7de;--side:#f6f8fa;--acc:#0969da;--hov:#eaeef2}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--mute:#8b949e;--line:#30363d;--side:#161b22;--acc:#58a6ff;--hov:#21262d}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
aside{width:310px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%}
aside h1{font-size:1.05rem;margin:0;padding:14px 16px 6px}
aside p{margin:0;padding:0 16px 8px;color:var(--mute);font-size:.8rem}
#q{margin:4px 12px 8px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
#tree{overflow:auto;flex:1;padding:0 8px 16px}
details{margin-left:4px}summary{cursor:pointer;padding:4px 6px;border-radius:6px;font-weight:600}
summary:hover,a:hover{background:var(--hov)}
details>div{margin-left:10px;border-left:1px solid var(--line);padding-left:4px}
a{display:block;padding:4px 8px;border-radius:6px;color:var(--fg);text-decoration:none}
a.on{background:var(--acc);color:#fff}
main{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--mute)}
#bar a{display:inline;color:var(--acc)}
#menu{display:none;font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:3px 10px}
iframe{flex:1;border:0;width:100%;background:#fff}
#empty{margin:auto;color:var(--mute);text-align:center;padding:24px}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--acc)}
@media (max-width:760px){
 aside{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .25s;width:85%;max-width:340px}
 body.open aside{transform:none}#menu{display:inline-block}}
</style>
</head>
<body>
<aside>
 <h1>📚 Learning materials</h1><p id="meta">Loading…</p>
 <input id="q" type="search" placeholder="Search notes">
 <div id="tree"></div>
</aside>
<main>
 <div id="bar"><button id="menu">☰ Menu</button><span id="cur">Pick a note</span><span style="flex:1"></span><a id="ext" target="_blank" rel="noopener" hidden>Open in new tab</a></div>
 <div id="empty">Choose a note from the list.</div>
 <iframe id="f" hidden title="Note"></iframe>
</main>
<script>
const $=s=>document.querySelector(s);
const pretty=n=>{n=n.replace(/\.html?$/i,'').replace(/[-_]+/g,' ').trim();return n.charAt(0).toUpperCase()+n.slice(1)};
// Owner/repo come from the Pages address. Override with ?repo=owner/name if needed.
const ov=new URLSearchParams(location.search).get('repo');
let owner,repo;
if(ov)[owner,repo]=ov.split('/');else{owner=location.hostname.split('.')[0];repo=location.pathname.split('/')[1]}
function fail(m){$('#meta').textContent=m;$('#tree').innerHTML=''}
async function load(){
  if(!owner||!repo||location.hostname.indexOf('github.io')<0&&!ov)return fail('Open this on your github.io site, or add ?repo=owner/name to the URL.');
  try{
    const info=await (await fetch(`https://api.github.com/repos/${owner}/${repo}`)).json();
    if(!info.default_branch)return fail('Could not read the repo. Is it public?');
    const t=await (await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${info.default_branch}?recursive=1`)).json();
    const files=(t.tree||[]).filter(x=>x.type==='blob'&&/\.html?$/i.test(x.path)&&x.path.toLowerCase()!=='index.html'&&!x.path.startsWith('.'));
    const root={d:{},f:[]};
    files.forEach(x=>{const p=x.path.split('/');let n=root;p.slice(0,-1).forEach(s=>n=n.d[s]=n.d[s]||{d:{},f:[]});n.f.push({name:p[p.length-1],path:x.path})});
    $('#tree').innerHTML=render(root,true);
    $('#meta').textContent=`${files.length} notes in ${repo}`;
    route();
  }catch(e){fail('Could not load the file list (GitHub API limit or network). Try again in a minute.')}
}
function render(n,top){
  let h='';
  Object.keys(n.d).sort().forEach(k=>h+=`<details ${top?'open':''}><summary>📁 ${pretty(k)}</summary><div>${render(n.d[k],false)}</div></details>`);
  n.f.sort((a,b)=>a.name.localeCompare(b.name)).forEach(f=>h+=`<a href="#${encodeURIComponent(f.path)}" data-p="${f.path}">${pretty(f.name)}</a>`);
  return h;
}
function route(){
  const p=decodeURIComponent(location.hash.slice(1));
  document.querySelectorAll('#tree a').forEach(a=>a.classList.toggle('on',a.dataset.p===p));
  document.body.classList.remove('open');
  if(!p)return;
  const a=[...document.querySelectorAll('#tree a')].find(x=>x.dataset.p===p);
  if(a){for(let d=a.parentElement;d;d=d.parentElement)if(d.tagName==='DETAILS')d.open=true;$('#cur').textContent=a.textContent}
  const url=p.split('/').map(encodeURIComponent).join('/');
  $('#f').src=url;$('#f').hidden=false;$('#empty').hidden=true;
  $('#ext').href=url;$('#ext').hidden=false;
}
addEventListener('hashchange',route);
$('#menu').onclick=()=>document.body.classList.toggle('open');
$('#q').oninput=e=>{
  const q=e.target.value.toLowerCase();
  document.querySelectorAll('#tree a').forEach(a=>a.style.display=a.textContent.toLowerCase().includes(q)?'':'none');
  [...document.querySelectorAll('#tree details')].reverse().forEach(d=>{
    const any=[...d.querySelectorAll('a')].some(a=>a.style.display!=='none');
    d.style.display=any?'':'none';if(q&&any)d.open=true});
};
load();
</script>
</body>
</html>
